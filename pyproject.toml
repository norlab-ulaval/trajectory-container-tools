[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajectory-container-tools"
dynamic = ["version"]

description = "Trajectory Container Tools for Robotic Deep Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "RedLeader Research", email = "research@redleader.com" }
]
keywords = ["robotics", "reinforcement-learning", "trajectory", "dataclass"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
#    "matplotlib",
#    "numpy",
    "matplotlib >= 3.8.0",  # These versions support NumPy 2.x
    "numpy >= 2.0.0",
    "pandas",
    "tqdm",
    "rosbags", # For ROS bag functionality
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "black",
    "flake8",
]

[tool.setuptools.packages.find]
# Recommended Following a src-layout repository structure where "." is the repository root
# and "src" is the source code location.
where = [
    ".",
    "src"
]
# Recommended directory exclusion to prevent build faillure for cases where python projects
# are collocated along side ros2 projects in the same repository.
exclude = [
    #"src/ros2_packages*", # <-- uncomment and update with your ros pkg path
    "*/build",
    "*/install",
    "*/log"
]

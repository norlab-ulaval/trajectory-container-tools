# =================================================================================================
# Dockerized-NorLab project application (DNA) (project-ci-tests entrypoint required file)
#
# Ini option ref: https://docs.pytest.org/en/7.1.x/reference/reference.html#ini-options-ref
# =================================================================================================

[pytest]
minversion = 7.2.2
required_plugins =
    pytest-benchmark>=5.0.1
    pytest-env
env =
    LOADED_ENV_FROM_PYTEST_INI=loaded like a boss
    DNA_PYTEST_CI_RUN=True
testpaths =
    tests
markers =
    automated_test: mark a test when executed from a test suite.
    slow: mark test as slow.
    benchmark: marks tests as benchmark tests
addopts =
; ....Disable plugin...............................
    -p no:randomly
; Disable ROS2 launch_testing pytest plugins (auto-loaded via setuptools entrypoints).
; They are incompatible with modern pytest (>=8) and crash the CI session:
;   - `launch_testing` (launch_testing.pytest.hooks) declares the legacy
;     `pytest_pycollect_makemodule(path, parent)` hookimpl using the removed `path`
;     argument -> PluginValidationError at startup.
;   - `launch_ros` (launch_testing_ros_pytest_entrypoint) implements the
;     `pytest_launch_collect_makemodule` hook (whose hookspec lives in `launch_testing`)
;     -> "unknown hook" PluginValidationError once `launch_testing` is disabled.
; These plugins are only needed for ros2_packages tests, which CI already excludes.
    -p no:launch_testing
    -p no:launch_ros
; ....pytest-randomly..............................
;    --randomly-dont-reset-seed
;    --randomly-dont-reorganize
; ....pytest-benchmark..............................
    --benchmark-storage=/ros2_ws/src/trajectory-container-tools/tests/.benchmarks
    --benchmark-only
    --benchmark-verbose
;    --benchmark-save-data
    --benchmark-sort="name"
;      ↳ Can be one of: 'min', 'max', 'mean', 'stddev', 'name', 'fullname'. Default: 'min'
;    --benchmark-autosave
    --benchmark-columns="min, max, mean, stddev, median, iqr, outliers"
;      ↳ Default: "min, max, mean, stddev, median, iqr, outliers, ops, rounds, iterations"
;    --benchmark-time-unit="auto"
;      ↳ Available units: 'ns', 'us', 'ms', 's'. Default: 'auto'.
    --benchmark-calibration-precision=20
;      ↳ Default: 10
; Baseline for "test_extract_rosbag_feature_benchmark()"
    --benchmark-save="original_erf"
;    --benchmark-compare="0001_original_erf"
; Baseline for "test_from_rosbag_benchmark()"
;    --benchmark-save="original_fr"
;    --benchmark-compare="0002_original_fr"
; Baseline for "test_benchmark_gather_rosbag_trajectory_window_informations()"
;    --benchmark-save="original_grtwi"
;    --benchmark-compare="0001_original_grtwi"

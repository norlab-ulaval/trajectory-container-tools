# =================================================================================================
# Dockerized-NorLab project application (DNA) (project-ci-tests entrypoint required file)
#
# Ini option ref: https://docs.pytest.org/en/7.1.x/reference/reference.html#ini-options-ref
# =================================================================================================

[pytest]
minversion = 7.2.2
required_plugins =
    pytest-xdist>=3.8.0
    pytest-benchmark>=5.0.1
    pytest-env
env =
    LOADED_ENV_FROM_PYTEST_INI=loaded like a boss
    DNA_PYTEST_CI_RUN=True
    PYTEST_RUN_CONFIG=True
testpaths =
    tests
markers =
    automated_test: mark a test when executed from a test suite.
    slow: mark test as slow.
    benchmark: marks tests as benchmark tests
addopts =
; ....Disable plugin...............................
    -p no:randomly
; Disable ROS2 launch_testing plugin: its pytest_pycollect_makemodule(path, parent)
; hookimpl uses the removed `path` argument and crashes pytest at startup with a
; PluginValidationError when the plugin is auto-loaded via setuptools entrypoints.
    -p no:launch_testing
; ....pytest-benchmark..............................
    --benchmark-skip

